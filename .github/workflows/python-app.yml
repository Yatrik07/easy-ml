name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Lint (syntax errors, undefined names, unused imports)
        run: flake8 easyml tests --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with boosting + explainability extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[boost,eda,dev]"
      - name: Run tests
        run: pytest -q

  test-core-only:
    # Guards against optional libraries (torch, shap, boosters) leaking into the core install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev]"
      - name: Run tests on a core-only install
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-core-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the UI is bundled in the wheel
        run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'easyml/unified_frontend/dist/index.html' in names, names"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
