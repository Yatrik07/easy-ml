[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-ml"
version = "0.3.0"
description = "An easy-to-use, no-code ML training and inference platform with a browser-based UI."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

authors = [
  { name = "Yatrikkumar Shah", email = "yatriksshah@gmail.com" },
  { name = "Pawan Kumar J", email = "pawanjain72002@gmail.com" },
  { name = "Esha Mishra", email = "emish8cool@gmail.com" },
  { name = "Dhruv Jain", email = "djamitjn@gmail.com" }
]

keywords = ["machine-learning", "automl", "nlp", "computer-vision", "no-code", "flask", "training", "inference"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: Flask",
]

# Core dependencies
dependencies = [
  "Flask>=3.0.0",
  "Flask-SocketIO>=5.3.0",
  "flask-cors>=4.0.0",
  "eventlet>=0.33.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0,<2",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "matplotlib>=3.8.0",
  "plotly>=5.18.0",
  "lightgbm>=4.0.0",
  "xgboost>=2.0.0",
  "catboost>=1.2.0",
  "pydantic>=2.5.0",
  "graphviz>=0.20.0",
  "requests>=2.31.0",
  "spacy>=3.7.0",
  "nltk>=3.8.0",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"
]

[project.urls]
Homepage = "https://github.com/Yatrik07/easy-ml"
Repository = "https://github.com/Yatrik07/easy-ml"
"Bug Tracker" = "https://github.com/Yatrik07/easy-ml/issues"

[project.optional-dependencies]
nlp = [
  "spacy>=3.7.0",
  "nltk>=3.8.0",
  "sentence-transformers>=2.2.0",
]
cv = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "Pillow>=10.0.0",
]
eda = [
  "ydata-profiling>=4.6.4",
  "shap>=0.40.0",
]
all = [
  "easy-ml[nlp]",
  "easy-ml[cv]",
  "easy-ml[eda]",
]

[project.scripts]
easy-ml = "easyml.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["easyml*"]
exclude = ["logs*", "runs*", "database*", "test_folder*", "artifacts*"]

[tool.setuptools.package-data]
"easyml" = ["unified_frontend/dist/**/*"]
