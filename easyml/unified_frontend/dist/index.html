<!DOCTYPE html>
<html lang="en" data-version="__EASYML_VERSION__">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Easy-ML Studio: a no-code machine learning studio that runs on your own machine.">
    <title>Easy-ML Studio</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script>
        // Apply the saved theme before the first paint (avoids a flash of the wrong theme).
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('easyml.theme') || 'system'; } catch (e) { }
            var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <!-- Everything is bundled with the package, so the studio works offline. -->
    <link rel="stylesheet" href="/static/vendor/fonts.css">
    <link rel="stylesheet" href="/static/css/tokens.css?v=__EASYML_VERSION__">
    <link rel="stylesheet" href="/static/css/base.css?v=__EASYML_VERSION__">
    <link rel="stylesheet" href="/static/css/components.css?v=__EASYML_VERSION__">
    <link rel="stylesheet" href="/static/css/views.css?v=__EASYML_VERSION__">
    <script src="/static/vendor/__VUE_BUILD__"></script>
    <script src="/static/vendor/socket.io.min.js"></script>
    <script src="/static/vendor/chart.umd.js"></script>
</head>

<body>
    <div id="app"></div>
    <noscript><div class="boot-error">Easy-ML Studio needs JavaScript enabled in your browser.</div></noscript>
    <script type="module" src="/static/js/main.js?v=__EASYML_VERSION__"></script>
    <script>
        // If the interface fails to load (e.g. a script error), show a readable message instead of a blank page.
        setTimeout(function () {
            if (window.__easymlBooted) return;
            var app = document.getElementById('app');
            if (app && !app.children.length) {
                app.innerHTML = '<div class="boot-error"><h2>The interface did not load</h2>'
                    + '<p class="muted">Open the browser developer console for details, then reload the page. '
                    + 'If this keeps happening, please report it with the console output.</p></div>';
            }
        }, 6000);
    </script>
</body>

</html>
