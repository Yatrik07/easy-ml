# site_name: easyml-docs
site_name: EasyML Documentation
site_url: https://easyml.com  # Optional
theme:
  name: readthedocs
  features:
    - navigation.tabs
    - content.code.annotate
  language: en

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append("..")  # Adjust if needed

nav:
  - Home: index.md
  - API Reference:
      - Core: api/core.md
      - Config: api/config.md
      - Utils: api/utils.md
